plugins {
    id 'com.android.application'
}

def apiBaseUrl = project.findProperty('API_BASE_URL') ?: 'http://10.0.2.2:3000/'
if (!apiBaseUrl.endsWith('/')) apiBaseUrl += '/'

android {
    namespace 'com.shreegurudev.clinic'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shreegurudev.clinic'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
